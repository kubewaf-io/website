[build]
  command = "npm ci && hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.147.8"
  NODE_VERSION = "22"
  HUGO_ENV = "production"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
